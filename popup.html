<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Threat Detector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">ET</div>
      <div class="brand-copy">
        <p class="eyebrow">EMAIL THREAT DETECTOR</p>
        <p class="status"><span class="status-dot"></span>Ready to scan</p>
      </div>
      <button id="logout" class="icon-button" type="button" aria-label="Logout" title="Logout">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3m9-8h7a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-7"/></svg>
      </button>
    </header>

    <button id="scan" class="scan-button" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V4h3M17 4h3v3M20 17v3h-3M7 20H4v-3M8 12h8M12 8v8"/></svg>
      <span>Scan Current Page</span>
    </button>
    <p class="message" id="message" role="status" aria-live="polite"></p>

    <section class="result" id="result" aria-live="polite" hidden>
      <div class="result-heading">
        <span class="level-icon" id="level-icon" aria-hidden="true"></span>
        <div><p class="result-label">SCAN RESULT</p><h1 id="level">SAFE</h1></div>
        <span class="score" id="score">0</span>
      </div>
      <p class="page-title" id="page-title"></p>
      <ul id="reasons"></ul>
    </section>
    <p class="disclaimer">Rule-based demo. Always verify unexpected requests independently.</p>
  </main>
  <script src="scanner.js"></script>
  <script src="popup.js"></script>
</body>
</html>
