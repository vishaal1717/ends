<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Email Threat Detector</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-shell">
    <div class="brand-mark" aria-hidden="true">ET</div>
    <p class="eyebrow">EMAIL THREAT DETECTOR</p>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to check a page for suspicious signals.</p>

    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <div class="form-options">
        <label class="remember"><input id="remember" type="checkbox"> <span>Remember me</span></label>
        <button class="text-button" id="forgot" type="button">Forgot password?</button>
      </div>

      <p class="message" id="message" role="alert" aria-live="polite"></p>
      <button class="login-button" type="submit">Login</button>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
